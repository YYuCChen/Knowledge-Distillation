name: Quick isolated regressions
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quick-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quick:
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # Explicit small dependency list: never install the project/model extras.
      - run: python -m pip install 'pytest>=8.3,<9' 'Flask>=3.1,<4' 'PyYAML>=6,<7' 'jsonschema>=4.23,<5' 'httpx>=0.27,<1' 'pycryptodome>=3.20,<4' 'Pillow>=11,<13' 'markdown-it-py>=4,<5' 'pypdf>=6,<7'
      - name: Pure logic, transactions and mocked signing
        run: >-
          python -m pytest -q --junitxml=quick-tests.xml
          tests/v1/test_domain.py tests/v1/test_store.py
          tests/test_faithful_review.py tests/v1/test_review_resume.py
          tests/v1/test_v12_source_integrity.py tests/v1/test_vision_ocr.py
          tests/v1/test_mac_signing.py tests/v1/test_confirmation_concurrency.py
          tests/v1/test_local_secrets.py tests/v1/test_feishu_images.py
          tests/v1/test_feishu_actions.py tests/v1/test_ocr_review_policy.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quick-test-results
          path: quick-tests.xml
          retention-days: 3
          if-no-files-found: ignore
