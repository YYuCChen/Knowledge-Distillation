{% if hidden_collections %}
      <section class="section" data-sync-key="hidden-tasks">
        <h2>已隐藏</h2>
        <details class="status-panel compact-panel" data-persist-details="hidden-tasks">
          <summary class="compact-summary"><span class="summary-signal"><img src="{{ url_for('static',filename='icons/state-grey.svg') }}" alt=""></span><span class="summary-text">{{ hidden_collections|length }} 项已隐藏；原始资料保留</span><span class="panel-chevron"><img class="closed-chevron" src="{{ url_for('static',filename='icons/chevron-up.svg') }}" alt=""><img class="open-chevron" src="{{ url_for('static',filename='icons/chevron-down.svg') }}" alt=""></span></summary>
          {% for task in hidden_collections %}
          <div class="operation-rows"><div class="operation-row waiting-row"><span>{{ task.total }} 条</span><span title="{{ task.title }}">{{ task.title }}</span><span>{{ task.label }}</span><time datetime="{{ task.created_at }}">{{ task.created_at[:10] }}</time></div></div>
          <footer class="knowledge-actions"><a class="source-link" href="{{ url_for('home',view_collection=task.operation_id) }}">查看资料</a><form action="{{ url_for('collection_visibility',operation=task.operation_id,action='restore') }}" method="post"><button class="source-link" title="恢复首页显示，不重新开始处理">恢复显示</button></form></footer>
          {% endfor %}
        </details>
      </section>
{% endif %}
