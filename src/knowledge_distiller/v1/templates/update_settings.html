<details class="setting-group" id="version-updates" {% if open_group == 'updates' %}open{% endif %}>
  <summary class="group-heading">
    <span class="group-number">4</span><strong>版本更新</strong>
    <img data-update-chevron src="{{ url_for('static', filename='icons/update-attention.svg' if update.attention else 'icons/chevron-down.svg') }}" alt="{{ '有新版更新说明' if update.attention else '' }}">
  </summary>
  <div class="update-content">
    <div class="update-version-row">
      <div class="update-version-info"><span>当前版本：</span><strong>{{ 'V' if update.display_version[0].isdigit() else '' }}{{ update.display_version }}</strong></div>
      <button type="button" class="secondary-button" data-update-primary>检查更新</button>
    </div>
    <p class="update-release-date">发行时间：{{ update.release_date }}</p>
    <div class="update-status-row"><p data-update-status role="status">{{ '尚未检查更新。' if update.configured else '此版本尚未配置更新源。' }}</p>
    <span data-update-package-size hidden></span></div>
    <p id="update-description" data-update-description hidden></p>
    <button type="button" class="secondary-button" data-update-full-fallback hidden>改用完整包</button>
    <div class="update-check-meta"><span data-update-time></span><button type="button" class="settings-text-action" data-update-recheck hidden>重新检查</button></div>
  </div>
</details>
