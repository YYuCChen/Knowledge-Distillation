[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-distiller"
version = "1.2.0"
description = "Local-first knowledge distiller MVP"
requires-python = ">=3.11.16,<3.12"
dependencies = [
  "Flask>=3.1,<4",
  "psutil==7.2.2",
  "pywin32==312; sys_platform == 'win32'",
  "pyobjc-framework-Vision==12.2.2; sys_platform == 'darwin'",
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0.2,<7",
  "pypdf>=6,<7",
  "httpx>=0.27,<1",
  "cryptography==50.0.1; sys_platform == 'win32'",
  "playwright==1.61.0",
  "websocket-client==1.9.0",
  "lark-oapi==1.7.3",
  "paddleocr==3.7.0; sys_platform != 'darwin'",
  "paddlex==3.7.2; sys_platform != 'darwin'",
  "paddlepaddle==3.3.0; sys_platform != 'darwin'",
  "docling==2.126.0",
  "torch==2.14.0",
  "torchvision==0.29.0",
  "transformers==5.16.1",
  "rapidocr==3.9.2",
  "onnxruntime==1.29.0",
  "opencv-python==4.10.0.84",
  "opencv-contrib-python==4.10.0.84; sys_platform != 'darwin'",
  "numpy==2.3.5",
  "markdown-it-py==4.2.0",
  "yt-dlp[default]==2026.08.19",
  "douyin-downloader @ git+https://github.com/jiji262/douyin-downloader.git@848bcaf7bf5c5bebbe028e8ccec76e30ad1bef6b",
]

[project.optional-dependencies]
mac = [
  "pyobjc-framework-Cocoa==12.2.2; sys_platform == 'darwin'",
]
build = [
  "pyinstaller==6.22.2",
]
secondary = [
  "httpx>=0.27,<1",
  "cryptography==50.0.1; sys_platform == 'win32'",
  "tos==2.9.2",
]
test = [
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["knowledge_distiller.legacy*"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
knowledge_distiller = [
  "v1/adapters/*.mjs",
  "v1/adapters/python_policy.py",
  "v1/adapters/python-runtime.json",
  "v1/adapters/qwen_worker.py",
  "v1/adapters/qwen-selftest.wav",
  "v1/adapters/qwen_windows_worker.py",
  "v1/adapters/qwen-windows-lock.json",
  "v1/adapters/qwen-mac-requirements.txt",
  "v1/adapters/qwen-model-manifests.json",
  "v1/adapters/docling-models-manifest.json",
  "v1/adapters/update-codec-notices.txt",
  "v1/templates/*.html",
  "v1/static/*.css",
  "v1/static/*.js",
  "v1/static/fonts/*.md",
  "v1/static/fonts/*.txt",
  "v1/static/fonts/*.woff2",
  "v1/static/icons/*.svg",
  "v1/static/icons/*.png",
  "v1/static/guides/*.html",
  "v1/static/guides/*.css",
  "v1/static/guides/assets/doubao-asr/*.png",
]
